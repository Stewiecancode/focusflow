services:
  - type: web
    name: focusflow-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.16.0
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGINS
        sync: false
